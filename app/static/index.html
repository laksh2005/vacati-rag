<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vacati RAG</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet" />
<style>
  :root {
    --font: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --bg: #0b0c0f;
    --text: #eceef1; --dim: #8a8f98;
    --glass: rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.09); --border-strong: rgba(255,255,255,0.18);
    --accent: #eceef1; --warn: #d9a86c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 64px 20px;
    font-family: var(--font); color: var(--text); background: var(--bg);
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.01em; }
  p.sub { color: var(--dim); margin: 0 0 32px; font-size: 14px; max-width: 52ch; line-height: 1.5; }

  .glass {
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: 12px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }

  .panel { padding: 18px; margin-bottom: 12px; }

  input {
    width: 100%; font-family: var(--font); font-size: 14px;
    padding: 11px 14px; color: var(--text);
    background: rgba(0,0,0,0.25); border: 1px solid var(--border);
    border-radius: 8px; outline: none; transition: border-color .15s;
  }
  input::placeholder { color: var(--dim); }
  input:focus { border-color: var(--border-strong); }

  .row { display: flex; gap: 8px; margin-bottom: 10px; }
  .row input { flex: 1; }

  button {
    font-family: var(--font); font-weight: 600; font-size: 14px;
    padding: 11px 20px; border: 1px solid var(--text); border-radius: 8px;
    color: var(--bg); cursor: pointer; background: var(--text);
    transition: opacity .12s;
  }
  button:hover { opacity: .85; }
  button:disabled { opacity: .35; cursor: default; }

  .samples { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .samples button {
    background: transparent; color: var(--dim); font-weight: 400; font-size: 12.5px;
    padding: 6px 12px; border: 1px solid var(--border); border-radius: 999px;
  }
  .samples button:hover { color: var(--text); border-color: var(--border-strong); opacity: 1; }

  #answer { font-size: 14.5px; line-height: 1.6; white-space: pre-wrap; border-left: 2px solid var(--text); }
  #answer.fallback { border-left-color: var(--warn); color: var(--warn); }
  #answer.empty { color: var(--dim); border-left-color: var(--border); }

  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); font-weight: 600; margin: 0 0 8px; }
  .cite { padding: 12px 14px; margin-bottom: 8px; }
  .cite .head { display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; margin-bottom: 5px; }
  .cite .sec { color: var(--text); font-weight: 600; }
  .cite .meta { color: var(--dim); white-space: nowrap; }
  .cite .snip { color: var(--dim); font-size: 13px; line-height: 1.5; }

  #meta {
    color: var(--dim); font-size: 12.5px; padding: 10px 16px;
    display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
  }
  .badge {
    border: 1px solid var(--border-strong); color: var(--text);
    border-radius: 4px; padding: 1px 8px; font-size: 11px; font-weight: 600;
  }
</style>
</head>
<body>
<main>
  <h1>Vacati RAG</h1>
  <p class="sub">Grounded answers over Vacati's travel docs, tours and menu. Every answer cites its sources, or says it doesn't know.</p>

  <div class="glass panel">
    <div class="row"><input id="key" type="password" placeholder="X-API-Key (demo-key)" /></div>
    <div class="row">
      <input id="q" placeholder="Ask a question..." autocomplete="off" />
      <button id="ask">Ask</button>
    </div>
    <div class="samples"></div>
  </div>

  <div id="answer" class="glass panel empty">Ask something to get started.</div>
  <div id="cites"></div>
  <div id="meta" class="glass" style="display:none"></div>
</main>

<script>
const SAMPLES = [
  "What is the cancellation policy for Villa Aurora?",
  "How much is the Pompeii and Vesuvius tour, and what does it include?",
  "Which dishes on the menu are vegan?",
  "Can I bring my dog to Cliff House?",
  "What is the wifi password?"
];

const $ = (id) => document.getElementById(id);
const keyInput = $("key"), qInput = $("q"), askBtn = $("ask");

keyInput.value = localStorage.getItem("vacati_key") || "";
keyInput.addEventListener("change", () => localStorage.setItem("vacati_key", keyInput.value));

for (const sample of SAMPLES) {
  const button = document.createElement("button");
  button.textContent = sample;
  button.onclick = () => { qInput.value = sample; ask(); };
  document.querySelector(".samples").append(button);
}

askBtn.onclick = ask;
qInput.addEventListener("keydown", (event) => { if (event.key === "Enter") ask(); });

async function ask() {
  const query = qInput.value.trim();
  if (!query) return;

  askBtn.disabled = true;
  $("answer").className = "glass panel empty";
  $("answer").textContent = "Retrieving...";
  $("cites").innerHTML = "";
  $("meta").style.display = "none";

  try {
    const response = await fetch("/v1/query", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-API-Key": keyInput.value },
      body: JSON.stringify({ query })
    });
    const data = await response.json();

    if (!response.ok) {
      $("answer").className = "glass panel fallback";
      $("answer").textContent = `${data.error.code}: ${data.error.message}`;
      return;
    }
    render(data);
  } catch (error) {
    $("answer").className = "glass panel fallback";
    $("answer").textContent = String(error);
  } finally {
    askBtn.disabled = false;
  }
}

function render(data) {
  const grounded = data.answer_type === "grounded";
  $("answer").className = "glass panel " + (grounded ? "" : "fallback");
  $("answer").textContent = data.answer;

  if (data.citations.length) {
    $("cites").innerHTML = "<h2>Sources</h2>" + data.citations.map((c) => `
      <div class="glass cite">
        <div class="head">
          <span class="sec">${escapeHtml(c.section)}</span>
          <span class="meta">${c.document} - ${c.score}</span>
        </div>
        <div class="snip">${escapeHtml(c.snippet)}...</div>
      </div>`).join("");
  }

  const usage = data.usage;
  $("meta").style.display = "flex";
  $("meta").innerHTML = [
    `${data.latency_ms} ms`,
    `${usage.input_tokens} in / ${usage.output_tokens} out tokens`,
    `$${usage.estimated_cost_usd.toFixed(6)}`,
    usage.cached ? `<span class="badge">cached</span>` : ""
  ].filter(Boolean).join(" &middot; ");
}

function escapeHtml(text) {
  return text.replace(/[&<>]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[ch]));
}
</script>
</body>
</html>
