<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vacati RAG</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
  :root {
    --font: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --serif: "Instrument Serif", Georgia, serif;
    --bg: #0b0c0f; --panel: #111318; --raise: #16181e;
    --text: #eceef1; --dim: #8a8f98; --faint: #55585f;
    --border: rgba(255,255,255,0.09); --border-strong: rgba(255,255,255,0.22);
    --warn: #d9a86c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font); color: var(--text); background: var(--bg); }

  header {
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
    padding: 20px 28px; border-bottom: 1px solid var(--border);
  }
  header .name { font-family: var(--serif); font-size: 21px; font-style: italic; letter-spacing: 0; }
  header input {
    width: 200px; font-family: var(--font); font-size: 12.5px; padding: 7px 11px;
    color: var(--dim); background: transparent; border: 1px solid var(--border);
    border-radius: 6px; outline: none;
  }
  header input:focus { border-color: var(--border-strong); color: var(--text); }

  main { max-width: 680px; margin: 0 auto; padding: 0 24px 100px; }

  .console { padding: 40px 0 28px; border-bottom: 1px solid var(--border); }
  .prompt-row { display: flex; align-items: center; gap: 10px; }
  .caret { font-family: var(--serif); font-size: 20px; color: var(--faint); font-style: italic; }
  #q {
    flex: 1; font-family: var(--font); font-size: 17px;
    padding: 4px 0; color: var(--text);
    background: transparent; border: none; border-bottom: 1px solid var(--border);
    outline: none; transition: border-color .15s;
  }
  #q:focus { border-color: var(--text); }
  #q::placeholder { color: var(--faint); }
  #ask {
    font-family: var(--font); font-weight: 600; font-size: 12.5px;
    padding: 7px 16px; border: 1px solid var(--text); border-radius: 999px;
    color: var(--bg); cursor: pointer; background: var(--text);
  }
  #ask:hover { opacity: .85; }
  #ask:disabled { opacity: .3; cursor: default; }

  .samples { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
  .samples button {
    font-family: var(--font); background: transparent; color: var(--dim);
    font-weight: 400; font-size: 12px; padding: 5px 11px;
    border: 1px solid var(--border); border-radius: 999px; cursor: pointer;
  }
  .samples button:hover { color: var(--text); border-color: var(--border-strong); }

  #feed { padding-top: 8px; }
  .empty { color: var(--faint); font-size: 13.5px; padding: 60px 0; text-align: center; }

  .entry { padding: 28px 0; border-bottom: 1px solid var(--border); }
  .entry:first-child { padding-top: 24px; }
  .entry .question { font-size: 13px; color: var(--dim); margin-bottom: 12px; }
  .entry .question::before { content: "→  "; color: var(--faint); }
  .entry .answer { font-size: 15.5px; line-height: 1.65; white-space: pre-wrap; }
  .entry .answer.fallback { color: var(--warn); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
  .chip {
    font-family: var(--font); font-size: 12px; color: var(--dim);
    background: var(--panel); border: 1px solid var(--border); border-radius: 999px;
    padding: 5px 12px; cursor: pointer; user-select: none;
  }
  .chip:hover { color: var(--text); border-color: var(--border-strong); }
  .chip.open { color: var(--text); background: var(--raise); border-color: var(--border-strong); }

  .detail {
    display: none; margin-top: 10px; padding: 12px 14px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  }
  .detail.open { display: block; }
  .detail .doc { font-size: 11.5px; color: var(--faint); margin-bottom: 6px; }
  .detail .snip { font-size: 13px; color: var(--dim); line-height: 1.55; }

  .meta { display: flex; gap: 12px; flex-wrap: wrap; color: var(--faint); font-size: 11.5px; margin-top: 16px; }
  .badge { border: 1px solid var(--border-strong); border-radius: 4px; padding: 1px 7px; font-weight: 600; color: var(--dim); }
</style>
</head>
<body>
<header>
  <span class="name">Vacati RAG</span>
  <input id="key" type="password" placeholder="X-API-Key" />
</header>

<main>
  <div class="console">
    <div class="prompt-row">
      <span class="caret">›</span>
      <input id="q" placeholder="Ask about properties, policies, tours, menu..." autocomplete="off" />
      <button id="ask">Ask</button>
    </div>
    <div class="samples"></div>
  </div>

  <div id="feed"><div class="empty">Answers appear here, grounded in the indexed documents, with sources you can expand.</div></div>
</main>

<script>
const SAMPLES = [
  "What is the cancellation policy for Villa Aurora?",
  "How much is the Pompeii and Vesuvius tour?",
  "Which dishes on the menu are vegan?",
  "Can I bring my dog to Cliff House?",
  "What is the wifi password?"
];

const $ = (id) => document.getElementById(id);
const keyInput = $("key"), qInput = $("q"), askBtn = $("ask"), feed = $("feed");
let entryCount = 0;

keyInput.value = localStorage.getItem("vacati_key") || "demo-key";
keyInput.addEventListener("change", () => localStorage.setItem("vacati_key", keyInput.value));

for (const sample of SAMPLES) {
  const button = document.createElement("button");
  button.textContent = sample;
  button.onclick = () => { qInput.value = sample; ask(); };
  document.querySelector(".samples").append(button);
}

askBtn.onclick = ask;
qInput.addEventListener("keydown", (event) => { if (event.key === "Enter") ask(); });

async function ask() {
  const query = qInput.value.trim();
  if (!query) return;

  askBtn.disabled = true;
  qInput.value = "";

  const id = "e" + (++entryCount);
  if (entryCount === 1) feed.innerHTML = "";
  feed.insertAdjacentHTML("afterbegin", `
    <div class="entry" id="${id}">
      <div class="question">${escapeHtml(query)}</div>
      <div class="answer">Retrieving...</div>
    </div>`);

  try {
    const response = await fetch("/v1/query", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-API-Key": keyInput.value },
      body: JSON.stringify({ query })
    });
    const data = await response.json();
    const el = document.getElementById(id);

    if (!response.ok) {
      el.querySelector(".answer").textContent = `${data.error.code}: ${data.error.message}`;
      el.querySelector(".answer").classList.add("fallback");
      return;
    }
    render(el, data);
  } catch (error) {
    document.getElementById(id).querySelector(".answer").textContent = String(error);
  } finally {
    askBtn.disabled = false;
  }
}

function render(el, data) {
  const grounded = data.answer_type === "grounded";
  const answerEl = el.querySelector(".answer");
  answerEl.textContent = data.answer;
  answerEl.classList.toggle("fallback", !grounded);

  if (data.citations.length) {
    const chips = data.citations.map((c, i) => `<span class="chip" data-i="${i}">[${i + 1}] ${escapeHtml(c.section.split(">").pop().trim())}</span>`).join("");
    const details = data.citations.map((c, i) => `
      <div class="detail" data-i="${i}">
        <div class="doc">${c.document} &middot; ${c.section} &middot; score ${c.score}</div>
        <div class="snip">${escapeHtml(c.snippet)}...</div>
      </div>`).join("");
    el.insertAdjacentHTML("beforeend", `<div class="chips">${chips}</div>${details}`);
    el.querySelectorAll(".chip").forEach((chip) => {
      chip.onclick = () => {
        const i = chip.dataset.i;
        chip.classList.toggle("open");
        el.querySelector(`.detail[data-i="${i}"]`).classList.toggle("open");
      };
    });
  }

  const usage = data.usage;
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.innerHTML = [
    `${data.latency_ms} ms`,
    `${usage.input_tokens} in / ${usage.output_tokens} out tokens`,
    `$${usage.estimated_cost_usd.toFixed(6)}`,
    usage.cached ? `<span class="badge">cached</span>` : ""
  ].filter(Boolean).join(" &middot; ");
  el.appendChild(meta);
}

function escapeHtml(text) {
  return text.replace(/[&<>]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[ch]));
}
</script>
</body>
</html>
